<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloak</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="bar">
  <div class="brand">Cloak<span class="dot" id="dot" title="proxy status"></span></div>

  <div class="group">
    <label>port <input id="port" type="number" value="8080" min="1" max="65535"></label>
    <label>mode
      <select id="mode">
        <option value="auto">auto — mirror the client</option>
        <option value="mirror">mirror — strict</option>
        <option value="static">static — always the preset</option>
      </select>
    </label>
    <label>fingerprint <select id="preset"></select></label>
    <button id="toggle" class="primary">Start</button>
  </div>

  <div class="group right">
    <button id="intercept" title="Park matching requests until you forward or drop them">Intercept: off</button>
    <input id="interceptFilter" class="slim" placeholder="intercept only URLs containing…">
  </div>
</header>

<section class="bar sub">
  <input id="filter" class="grow" placeholder="filter — host, path, method, status, mime">
  <button id="clear">Clear</button>
  <span class="sep"></span>
  <button id="exportHar">Export HAR</button>
  <button id="importHar">Import HAR</button>
  <span class="sep"></span>
  <input id="projectName" class="slim" placeholder="project name">
  <button id="saveProject">Save</button>
  <select id="projects"><option value="">open project…</option></select>
  <span class="sep"></span>
  <button id="cert" title="Install this on the device you're intercepting">CA cert</button>
  <span class="count" id="count">0 flows</span>
</section>

<main>
  <div class="flows">
    <table id="table">
      <thead><tr>
        <th class="w-method">Method</th><th class="w-host">Host</th><th>Path</th>
        <th class="w-status">Status</th><th class="w-type">Type</th>
        <th class="w-size">Size</th><th class="w-time">Time</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="detail" id="detail">
    <div class="tabs">
      <button data-tab="request" class="on">Request</button>
      <button data-tab="response">Response</button>
      <button data-tab="edit">Edit &amp; resend</button>
      <span class="grow"></span>
      <button id="resume" class="ok hidden">Forward</button>
      <button id="drop" class="bad hidden">Drop</button>
      <button id="replay">Replay</button>
    </div>
    <div class="pane" id="pane"><p class="empty">Pick a flow.</p></div>
  </div>
</main>

<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
