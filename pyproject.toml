[project]
name = "cloakproxy"
version = "0.2.0"
description = "Intercepting proxy whose upstream TLS looks like the real client"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["mitmproxy", "proxy", "tls-fingerprint", "ja3", "ja4", "security"]
dependencies = [
  "mitmproxy>=12.0",
  "mitmcloak>=0.1.0",
  "httpcloak>=1.7.0",
  "tornado>=6.4",
]

[project.optional-dependencies]
window = ["pywebview>=5.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Glaze10/MITM-CLOAK-PROXY"
Issues = "https://github.com/Glaze10/MITM-CLOAK-PROXY/issues"

[project.scripts]
cloak = "cloakproxy.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cloakproxy.web" = ["static/*", "static/css/*", "static/js/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
